name: CI

on:
  push:
    branches:
      - main
      - dev/phase-1-foundation
      - upgrade/expo-sdk-58
  pull_request:
    branches:
      - main
      - dev/phase-1-foundation
      - upgrade/expo-sdk-58

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint, Test & Health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run automated test suite with coverage
        run: npm run test:coverage

      - name: Expo Doctor project diagnostic
        run: npx expo-doctor

